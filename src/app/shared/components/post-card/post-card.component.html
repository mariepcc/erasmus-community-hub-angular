<div class="post-card">
  <div class="post-header">
    <img [src]="post.author.avatar" 
         [alt]="post.author.username" 
         class="author-avatar" />
    <div class="author-info">
      <h4 class="author-name">{{ post.author.username }}</h4>
      <span class="post-time">{{ post.timestamp | date: 'short' }}</span>
    </div>
  </div>

  <div class="post-content">
    <p>{{ post.content }}</p> 
  </div>

  <div class="post-actions">
    <button 
      class="action-btn" 
      [class.active]="isLiked"
      (click)="toggleLike()">
      <lucide-icon [img]="HeartIcon" [size]="20"></lucide-icon>
      <span>{{ post.likes || 0 }}</span>
    </button>

    <button 
      class="action-btn" 
      (click)="openComments()">
      <lucide-icon [img]="MessageCircleIcon" [size]="20"></lucide-icon>
      <span>{{ post.comments.length || 0 }}</span>
    </button>

    <button 
      class="action-btn" 
      (click)="sharePost()">
      <lucide-icon [img]="Share2Icon" [size]="20"></lucide-icon>
      <span>Share</span>
    </button>
  </div>
</div>
