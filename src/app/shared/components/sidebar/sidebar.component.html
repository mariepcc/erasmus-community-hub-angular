<!-- src/app/shared/components/sidebar/sidebar.component.html -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="logo">🎓</div>
    <h2>Erasmus Hub</h2>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/home" routerLinkActive="active" class="nav-item">
      <span class="icon">🏠</span>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">👤</span>
      <span>My Profile</span>
    </a>
    <a href="#" class="nav-item">
      <span class="icon">👥</span>
      <span>Friends</span>
    </a>
  </nav>

  <div class="communities-section">
    <h3 class="section-title">Communities</h3>

    
    <div class="communities-list">
      <div *ngFor="let country of countries" class="community-item">
        <div class="country-header" (click)="toggleCountry(country.code)">
          <div class="country-info">
            <span class="flag">{{ country.flag }}</span>
            <span class="country-name">{{ country.name }}</span>
          </div>
          <span class="toggle-icon" [class.expanded]="country.isExpanded">
            {{ country.isExpanded ? '▼' : '▶' }}
          </span>
        </div>
        
        <div class="cities-list" *ngIf="country.isExpanded">
          <a *ngFor="let city of country.cities" 
             href="#" 
             class="city-item">
            <span class="city-name">{{ city.name }}</span>
            <span class="member-count">{{ city.memberCount }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</aside>
