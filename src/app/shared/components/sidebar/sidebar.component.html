<aside class="sidebar" [class.open]="isOpen">
  <div class="sidebar-header">
    <img src="/images/logo.png" alt="Erasmus Hub Logo" class="logo" />
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/" 
   routerLinkActive="active" 
   [routerLinkActiveOptions]="{exact: true}" 
   class="nav-item">
  <lucide-icon [img]="HomeIcon" class="icon"></lucide-icon>
  <span>Home</span>
</a>
    <a routerLink="/my-profile" routerLinkActive="active" class="nav-item">
      <lucide-icon [img]="UserIcon" class="icon"></lucide-icon>
      <span>My Profile</span>
    </a>
    <a routerLink="/friends" routerLinkActive="active" class="nav-item">
      <lucide-icon [img]="UsersIcon" class="icon"></lucide-icon>
      <span>Friends</span>
    </a>
  </nav>

  <div class="communities-section">
    <div class="section-header">
      <h3 class="section-title">Communities</h3>
      <button class="add-community-btn">
        <lucide-icon [img]="PlusIcon" [size]="18"></lucide-icon>
      </button>
    </div>

    <div class="communities-list">
      <div *ngFor="let country of countries" class="community-item">
        <div class="country-header" (click)="toggleCountry(country.code)" [class.active]="country.isExpanded">
          <div class="country-info">
            <img [src]="'https://hatscripts.github.io/circle-flags/flags/' + country.code.toLowerCase() + '.svg'" class="flag" />
            <span class="country-name">{{ country.name }}</span>
          </div>
          <lucide-icon [img]="ChevronRightIcon" class="toggle-icon" [class.expanded]="country.isExpanded" [size]="16"></lucide-icon>
        </div>

        <div class="cities-list" *ngIf="country.isExpanded">
          <a *ngFor="let city of country.cities" 
             [routerLink]="['/community', city.name.toLowerCase()]" 
             routerLinkActive="city-active"
             class="city-item">
            <span class="city-name">{{ city.name }}</span>
            <span class="member-count">{{ city.memberCount }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</aside>
