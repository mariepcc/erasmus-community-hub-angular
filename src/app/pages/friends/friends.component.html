<div class="friends-page">
  <div class="page-header">
    <div class="header-content">
      <lucide-icon [img]="UsersIcon" [size]="32"></lucide-icon>
      <div>
        <h1>Friends</h1>
        <p>Connect with your Erasmus community</p>
      </div>
    </div>
    <button class="btn-primary-main">
      <lucide-icon [img]="UserPlusIcon" [size]="20"></lucide-icon>
      <span>Find Friends</span>
    </button>
  </div>

  <div class="friends-content">
    <div class="search-section">
      <div class="search-bar">
        <lucide-icon [img]="SearchIcon" [size]="20"></lucide-icon>
        <input type="text" placeholder="Search friends..." />
      </div>
    </div>

    <div class="friends-grid">
      <div *ngFor="let friend of friends" class="friend-card">
        <div class="friend-avatar-wrapper">
          <img [src]="friend.avatar" [alt]="friend.username" class="friend-img" />
          <span class="status-indicator" [class.online]="friend.isOnline"></span>
        </div>
        
        <div class="friend-info">
          <h3>{{ friend.username }}</h3>
          <p class="location">{{ friend.city }}, {{ friend.country }}</p>
        </div>
        
        <div class="friend-actions">
          <button class="btn-action profile" (click)="navigateToProfile(friend.id)">
            <lucide-icon [img]="EyeIcon" [size]="16"></lucide-icon>
            <span>Profile</span>
          </button>
          
          <button class="btn-action message" (click)="openChat(friend)">
            <lucide-icon [img]="MessageIcon" [size]="16"></lucide-icon>
            <span>Message</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mini-chat-overlay" *ngIf="activeChatUser">
  <div class="mini-chat-window">
    <div class="chat-header">
      <div class="user-info">
        <img [src]="activeChatUser.avatar" alt="">
        <div>
          <h4>{{ activeChatUser.username }}</h4>
          <span class="status-text">Active now</span>
        </div>
      </div>
      <button class="close-btn" (click)="closeChat()">
        <lucide-icon [img]="CloseIcon" [size]="18"></lucide-icon>
      </button>
    </div>

    <div class="chat-messages">
      <div *ngFor="let msg of chatMessages" 
           [ngClass]="{'sent': msg.isMine, 'received': !msg.isMine}" class="message">
        <div class="bubble">
          {{ msg.content }}
        </div>
      </div>
    </div>

    <div class="chat-footer">
      <input type="text" 
             placeholder="Type a message..." 
             [(ngModel)]="newMessageContent" 
             (keyup.enter)="sendMessage()">
      <button class="send-btn" (click)="sendMessage()">
        <lucide-icon [img]="SendIcon" [size]="18"></lucide-icon>
      </button>
    </div>
  </div>
</div>
