<div class="create-post-card" *ngIf="currentUser">
  <div class="create-post-collapsed" *ngIf="!isExpanded" (click)="expandEditor()">
    <img [src]="currentUser.avatar" 
         [alt]="currentUser.username + ' avatar'" 
         class="user-avatar" />
    <div class="post-placeholder">
      What's on your mind, {{ currentUser.username }}?
    </div>
  </div>

  <div class="create-post-expanded" *ngIf="isExpanded">
    <div class="post-header">
      <img [src]="currentUser.avatar" 
           [alt]="currentUser.username" 
           class="user-avatar-small" />
      <span class="username">{{ currentUser.username }}</span>
    </div>

    <textarea 
      class="post-textarea" 
      [(ngModel)]="postContent"
      placeholder="Share something with the community..."
      rows="4"
      autofocus>
    </textarea>

    <div class="post-actions">
      <button class="btn btn-secondary" (click)="cancel()" type="button">
        Cancel
      </button>
      <button 
        class="btn btn-primary" 
        (click)="createPost()"
        [disabled]="!postContent || !postContent.trim()"
        type="button"
        title="Post your message">
        Post
      </button>
    </div>
  </div>
</div>
