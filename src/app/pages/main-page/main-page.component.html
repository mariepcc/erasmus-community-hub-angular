<div class="main-page">
  <div class="page-header">
    <h1>Home Feed</h1>
    <p>What's happening in your Erasmus community</p>
  </div>

  <app-create-post></app-create-post>

  <div *ngIf="isLoading" class="loading">
    <div class="loader"></div>
    <p>Loading posts...</p>
  </div>

  <div *ngIf="!isLoading" class="posts-feed">
    <app-post-card 
      *ngFor="let post of posts" 
      [post]="post"
      (viewComments)="selectedPostForComments = $event">
    </app-post-card>

    <div class="empty-state" *ngIf="posts.length === 0">
      <div class="empty-icon"></div>
      <h3>No posts yet</h3>
      <p>Be the first to share something with the community!</p>
    </div>
  </div>

  <app-comments-modal 
    *ngIf="selectedPostForComments" 
    [post]="selectedPostForComments" 
    (close)="selectedPostForComments = null">
  </app-comments-modal>
</div>
