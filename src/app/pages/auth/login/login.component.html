<div class="h-screen flex overflow-hidden">
  <div class="w-full lg:w-1/2 bg-white flex items-center justify-center p-8">
    <div class="w-full max-w-[280px] xl:max-w-lg 2xl:max-w-xl">
      <div class="mb-4">
        <h1 class="text-gray-900 text-xl lg:text-2xl 2xl:text-3xl font-bold mb-1">Welcome back!</h1>
        <p class="text-gray-500 text-xs lg:text-sm 2xl:text-base">Log in or create an account to meet other students</p>
      </div>
      
      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label for="email" class="block text-gray-900 text-xs lg:text-sm 2xl:text-base font-medium mb-1">
            E-mail
          </label>
          <input
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            class="w-full px-3 lg:px-4 2xl:px-5 py-2 2xl:py-3 rounded-md bg-white text-gray-900 text-xs lg:text-sm 2xl:text-base border border-gray-500 focus:border-blue-700 focus:outline-none transition-colors"
            required
          />
        </div>

        <div class="mb-1.5">
          <label for="password" class="block text-gray-900 text-xs lg:text-sm 2xl:text-base font-medium mb-1">
            Password
          </label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            class="w-full px-3 lg:px-4 2xl:px-5 py-2 2xl:py-3 rounded-md bg-white text-gray-900 text-xs lg:text-sm 2xl:text-base border border-gray-500 focus:border-blue-700 focus:outline-none transition-colors"
            required
          />
        </div>

        <div class="text-right mb-4">
          <button
            type="button"
            (click)="onForgotPassword()"
            class="text-gray-600 hover:text-gray-800 text-xs lg:text-sm 2xl:text-base underline transition-colors"
          >
            Forgot password?
          </button>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 2xl:py-3 text-sm lg:text-base 2xl:text-lg rounded-md transition-colors mb-4"
        >
          Log in
        </button>

        <div class="bg-blue-50 border border-blue-400 rounded-md p-4 lg:p-5 2xl:p-6 -mx-5">
          <h2 class="text-gray-900 font-bold mb-2 text-center text-lg lg:text-xl 2xl:text-2xl">New to Erasmus?</h2>
          <p class="text-gray-800 text-center mb-1.5 leading-snug text-sm lg:text-base 2xl:text-lg">
            Create an account, choose your city or university and join the student community from all over Europe.
          </p>
          <p class="text-gray-800 text-center mb-3 leading-snug text-sm lg:text-base 2xl:text-lg">
            Share experiences, ask questions and plan events together!
          </p>
          <button
            type="button"
            (click)="onSignUp()"
            class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 2xl:py-3 text-sm lg:text-base 2xl:text-lg rounded-md transition-colors"
          >
            Sign up
          </button>
        </div>
      </form>
    </div>
  </div>

  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-indigo-500 to-blue-600 items-center justify-center overflow-hidden">
    <img 
      src="images/login_img.png"
      alt="Erasmus students" 
      class="w-full h-full object-cover"
    />
  </div>
</div>
