<div class="h-screen flex overflow-hidden">
  <div class="w-full lg:w-1/2 bg-white flex items-center justify-center p-8">
    <div class="w-full max-w-[280px] xl:max-w-lg 2xl:max-w-xl">
      <div class="mb-4">
        <h1 class="text-gray-900 text-xl lg:text-2xl 2xl:text-3xl font-bold mb-1">Welcome back!</h1>
        <p class="text-gray-500 text-xs lg:text-sm 2xl:text-base">Log in or create an account to meet other students</p>
      </div>
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
  
  <div class="mb-3">
    <label for="email" class="block text-gray-900 font-medium mb-1">E-mail</label>
    <input
      type="email"
      id="email"
      formControlName="email"
      class="w-full px-4 py-2 rounded-md border border-gray-500 focus:border-blue-700 outline-none"
    />
    @if (form.get('email')?.invalid && form.get('email')?.touched) {
      <p class="text-red-500 text-xs mt-1">Please enter a valid email.</p>
    }
  </div>

  <div class="mb-1.5">
    <label for="password" class="block text-gray-900 font-medium mb-1">Password</label>
    <input
      type="password"
      id="password"
      formControlName="password"
      class="w-full px-4 py-2 rounded-md border border-gray-500 focus:border-blue-700 outline-none"
    />
  </div>

  @if (error) {
    <p class="text-red-600 text-sm mb-2 text-center font-bold">Invalid email or password.</p>
  }

  <div class="text-right mb-4">
    <button type="button" (click)="onForgotPassword()" class="text-gray-600 text-xs underline">
      Forgot password?
    </button>
  </div>

  <button
    type="submit"
    [disabled]="form.invalid"
    class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-2 rounded-md transition-colors disabled:bg-gray-400"
  >
    Log in
  </button>
  
  </form>
    </div>
  </div>

  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-indigo-500 to-blue-600 items-center justify-center overflow-hidden">
    <img 
      src="images/login_img.png"
      alt="Erasmus students" 
      class="w-full h-full object-cover"
    />
  </div>
</div>
