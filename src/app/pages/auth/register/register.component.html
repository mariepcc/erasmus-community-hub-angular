<div class="h-screen flex overflow-hidden relative">
  <div class="absolute inset-0">
    <img src="images/register_background.png" alt="Background" class="w-full h-full object-cover" />
  </div>

  <div class="relative z-10 w-full flex items-start justify-center overflow-y-auto">
    <div class="bg-white w-full max-w-md lg:max-w-xl min-h-screen p-8">
      <div class="mb-6">
        <h1 class="text-gray-900 text-2xl font-bold mb-2">Create an account</h1>
        <p class="text-gray-600 text-sm">Join the Erasmus student community!</p>
      </div>
      
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="mb-4">
          <label class="block text-gray-900 text-sm font-medium mb-1.5">Username (Display Name)</label>
          <input type="text" formControlName="username" class="w-full px-4 py-2 border rounded-md" required />
        </div>

        <div class="mb-4">
          <label class="block text-gray-900 text-sm font-medium mb-1.5">Email address</label>
          <input type="email" formControlName="email" class="w-full px-4 py-2 border rounded-md" required />
        </div>

        <div class="mb-6">
          <label class="block text-gray-900 text-sm font-medium mb-1.5">Password</label>
          <input type="password" formControlName="password" class="w-full px-4 py-2 border rounded-md" required />
        </div>

        @if (error) {
          <p class="text-red-600 text-sm mb-4 font-medium">Registration failed. Please try again.</p>
        }

        <button
          type="submit"
          [disabled]="form.invalid"
          class="w-full bg-blue-900 hover:bg-blue-950 text-white font-semibold py-3 rounded-lg transition-colors disabled:bg-gray-400"
        >
          Sign up
        </button>

        <div class="text-center mt-6">
          <p class="text-sm text-gray-600">
            Already have an account? 
            <button type="button" (click)="goToLogin()" class="text-blue-700 font-semibold underline">Log in</button>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
