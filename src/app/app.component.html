<ng-container *ngIf="isNotFoundPage">
  <router-outlet></router-outlet>
</ng-container>

<div class="app-container" *ngIf="!isNotFoundPage">
  <app-sidebar [isOpen]="isSidebarOpen" [class.open]="isSidebarOpen"></app-sidebar>

  <div class="main-content">
    <app-top-bar 
      (toggleSidebar)="toggleSidebar()"
      (toggleChat)="toggleChat()"
      (toggleNotifications)="toggleNotifications()"
      (createPost)="openCreatePost()">
    </app-top-bar>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="mobile-overlay" 
       [class.active]="isSidebarOpen"
       (click)="toggleSidebar()">
  </div>
</div>
<ng-container *ngIf="!isNotFoundPage">
  <app-chat-widget [isOpen]="isChatOpen" (close)="closeChat()"></app-chat-widget>
  <app-notification-widget [isOpen]="isNotificationsOpen" (close)="closeNotifications()"></app-notification-widget>
  <app-create-post-modal *ngIf="isCreatePostOpen" (close)="closeCreatePost()"></app-create-post-modal>
</ng-container>
