<!-- Layout tylko jeśli nie jesteśmy na /login -->
<div class="app-container" *ngIf="!isLoginPage()">
  <app-sidebar [class.open]="isSidebarOpen"></app-sidebar>
  
  <div class="main-content">
    <app-top-bar 
      (toggleSidebar)="toggleSidebar()"
      (toggleChat)="toggleChat()">
    </app-top-bar>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>

  <app-chat-widget [isOpen]="isChatOpen"></app-chat-widget>
</div>

<!-- Jeśli /login -->
<div *ngIf="isLoginPage()">
  <router-outlet></router-outlet>
</div>

<!-- Mobile Overlay -->
<div class="mobile-overlay" 
     *ngIf="isSidebarOpen" 
     (click)="toggleSidebar()">
</div>
