<div class="app-container">
  <!-- Sidebar - lewy pasek -->
  <app-sidebar [class.open]="isSidebarOpen"></app-sidebar>
  
  <div class="main-content">
    <!-- Top Bar - górny pasek -->
    <app-top-bar 
      (toggleSidebar)="toggleSidebar()"
      (toggleChat)="toggleChat()">
    </app-top-bar>

    <!-- NAJWAŻNIEJSZE: Content Area z router-outlet -->
    <main class="content-area">
      <!-- To pokazuje MainPageComponent! -->
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Chat Widget - prawy pasek -->
  <app-chat-widget [isOpen]="isChatOpen"></app-chat-widget>
</div>

<!-- Mobile Overlay -->
<div class="mobile-overlay" 
     *ngIf="isSidebarOpen" 
     (click)="toggleSidebar()">
</div>
